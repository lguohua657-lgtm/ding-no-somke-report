name: 测试钉钉提醒
run-name: 测试运行钉钉吸烟提醒脚本

on:
  # 允许你手动在仓库里点击按钮运行
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行脚本发送测试消息
        run: |
          python "python dingding_reminder.py"
