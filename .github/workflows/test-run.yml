name: 每日定时吸烟提醒
on:
  schedule:
    - cron: '0 1 * * *'    # 每天北京时间 9:00 发送
    - cron: '0 10 * * *'   # 每天北京时间 18:00 发送
  workflow_dispatch:       # 保留手动测试按钮

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 发送钉钉提醒
        run: python "python dingding_reminder.py"
